<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<title>Notification to calendar and task</title>
<defs>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29D8CD"/><stop offset="1" stop-color="#08A9AD"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9675F6"/><stop offset="1" stop-color="#7044D8"/></linearGradient>
</defs>
<rect width="1024" height="1024" rx="224" fill="url(#teal)"/>
<!-- Subtle dimensional lift; all shadows stay inside the rounded tile. -->
<rect x="232" y="322" width="504" height="470" rx="76" fill="#006C80" opacity=".12"/>
<rect x="232" y="304" width="504" height="470" rx="76" fill="#FFF"/>
