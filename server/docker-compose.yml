# Quick start: docker compose up -d   ->  http://<host>:8080/  (copy config.sample.php to config.php first)
services:
  web:
    image: php:8.3-apache
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
    command: >
      bash -c "docker-php-ext-install pdo_mysql >/dev/null && a2enmod rewrite >/dev/null && apache2-foreground"
    depends_on:
      - db
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: notitocal
      MARIADB_USER: notitocal
      # Required: export NOTITOCAL_DB_PASSWORD=... (same value as db_pass in config.php). No default password (C11).
      MARIADB_PASSWORD: ${NOTITOCAL_DB_PASSWORD:?set NOTITOCAL_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - notitocal-db:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  notitocal-db:
